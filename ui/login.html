<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <title>Sign in · T-800</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try { const t = localStorage.getItem('t800-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --border: #d0d5dd; --text: #101828; --text-2: #344054;
      --muted: #667085; --faint: #98a2b3; --primary: #4f46e5; --primary-hover: #4338ca;
      --danger: #d92d20; --danger-soft: #fef3f2; --ring: 0 0 0 4px rgba(79,70,229,.15);
      --shadow: 0 20px 24px -4px rgba(16,24,40,.08), 0 8px 8px -4px rgba(16,24,40,.03);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f17; --surface: #121826; --border: #334055; --text: #f2f4f7; --text-2: #d0d5dd;
        --muted: #98a2b3; --faint: #667085; --primary: #6366f1; --primary-hover: #818cf8;
        --danger: #f97066; --danger-soft: rgba(249,112,102,.12); --ring: 0 0 0 4px rgba(99,102,241,.25);
        --shadow: 0 20px 40px rgba(0,0,0,.5); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0f17; --surface: #121826; --border: #334055; --text: #f2f4f7; --text-2: #d0d5dd;
      --muted: #98a2b3; --faint: #667085; --primary: #6366f1; --primary-hover: #818cf8;
      --danger: #f97066; --danger-soft: rgba(249,112,102,.12); --ring: 0 0 0 4px rgba(99,102,241,.25);
      --shadow: 0 20px 40px rgba(0,0,0,.5); color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text); padding: 24px 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 400px; }
    .logo { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; margin: 0 auto 20px;
      background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff; box-shadow: 0 8px 20px rgba(79,70,229,.35); }
    .logo svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; text-align: center; }
    .lead { color: var(--muted); text-align: center; margin: 6px 0 28px; font-size: 15px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; box-shadow: var(--shadow); }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .field + .field { margin-top: 16px; }
    input {
      width: 100%; min-height: 44px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; font-size: 15px; outline: none;
      box-shadow: 0 1px 2px rgba(16,24,40,.05); transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--primary); box-shadow: var(--ring); }
    button {
      width: 100%; min-height: 44px; margin-top: 24px; border: 0; border-radius: 8px; background: var(--primary);
      color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:focus-visible { outline: none; box-shadow: var(--ring); }
    button:disabled { opacity: .7; cursor: progress; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 13.5px; }
    .err.show { display: block; }
    .foot { margin-top: 24px; color: var(--faint); font-size: 12.5px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
    <h1>Sign in to T-800</h1>
    <p class="lead">Your AI calling agent dashboard</p>
    <form class="card" id="form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button id="submit" type="submit">Sign in</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="foot">Authorised access only.</div>
  </div>
  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('submit');
    const err = document.getElementById('err');
    function showErr(msg) { err.textContent = msg; err.classList.toggle('show', !!msg); }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showErr('');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (r.ok) {
          window.location.href = '/';
          return;
        }
        let msg = 'Sign in failed';
        try { const d = await r.json(); if (d.detail) msg = d.detail; } catch {}
        showErr(msg);
      } catch {
        showErr('Network error. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
